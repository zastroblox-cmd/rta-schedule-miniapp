name: Free API keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping the public health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 20 https://rta-schedule-api.onrender.com/health; then
              echo
              exit 0
            fi
            sleep 5
          done
          echo "Render API health check failed after retries."
          exit 1
