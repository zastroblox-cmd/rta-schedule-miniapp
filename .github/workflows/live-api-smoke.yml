name: Live API smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test live API, all faculty directions and dated overrides
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'https://rta-schedule-api.onrender.com';
          async function get(path, expected = 200) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(25000) });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(path + ': response is not JSON: ' + text.slice(0, 250)); }
            assert.equal(response.status, expected, path + ': ' + JSON.stringify(body));
            return body;
          }

          const healthResponse = await fetch(base + '/health', { signal: AbortSignal.timeout(25000) });
          assert.equal(healthResponse.status, 200, 'API health HTTP status');
          assert.equal(healthResponse.headers.get('x-content-type-options'), 'nosniff', 'security header: nosniff');
          assert.equal(healthResponse.headers.get('referrer-policy'), 'strict-origin-when-cross-origin', 'security header: referrer policy');
          assert.equal(healthResponse.headers.get('permissions-policy'), 'camera=(), microphone=(), geolocation=()', 'security header: permissions policy');
          const health = await healthResponse.json();
          assert.equal(health.status, 'ok', 'API health status');
          assert.equal(health.databaseConfigured, true, 'database configuration');

          // Protected routes must reject requests without signed Telegram initData.
          for (const path of [
            '/api/owner/analytics',
            '/api/owner/verify',
            '/api/analytics/track',
            '/api/reminders/status',
            '/api/reminders'
          ]) {
            const response = await fetch(base + path, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({}),
              signal: AbortSignal.timeout(25000)
            });
            assert.equal(response.status, 403, path + ' must reject missing Telegram initData');
            const body = await response.json();
            assert.ok(!JSON.stringify(body).toLowerCase().includes('secret'), path + ' must not reveal secrets');
          }
          const representativeLogin = await fetch(base + '/api/representative/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}),
            signal: AbortSignal.timeout(25000)
          });
          assert.equal(representativeLogin.status, 400, 'representative login must require group and password');
          const representativeLoginBody = await representativeLogin.json();
          assert.ok(!JSON.stringify(representativeLoginBody).toLowerCase().includes('secret'), 'representative login must not reveal secrets');

          const faculties = await get('/api/faculties');
          assert.ok(Array.isArray(faculties.data) && faculties.data.length > 0, 'faculties must be non-empty');

          // /api/groups is shared across faculties and therefore must not be
          // pinned to the old law-only count. Validate the response shape only.
          const groups = await get('/api/groups');
          assert.ok(Array.isArray(groups.data) && groups.data.length > 0, 'groups must be non-empty');
          assert.ok(faculties.data.some(f => f.slug === 'customs' && f.name === 'Факультет таможенного дела'), 'customs faculty must be listed');
          const customsGroups = groups.data.filter(g => g.courses?.faculties?.slug === 'customs');
          assert.ok(customsGroups.length >= 22, 'customs faculty must contain all known groups; got ' + customsGroups.length);

          const routes = [
            ...[1,2,3,4].map(course => ({label:'law course '+course, path:'/api/course'+course+'-schedule'})),
            ...[1,2,3,4].map(course => ({label:'economics course '+course, path:'/api/economics/course'+course+'-schedule'})),
            ...[1,2,3,4].map(course => ({label:'applied informatics course '+course, path:'/api/customs/applied-informatics/course'+course+'-schedule'})),
            ...[1,2,3,4].map(course => ({label:'management course '+course, path:'/api/economics/management/course'+course+'-schedule'}))
          ];
          const customsRoutes = [1,2,3,4,5].map(course => ({label:'customs course '+course, path:'/api/customs/course'+course+'-schedule'}));

          const economicsAppliedInformaticsGroups = groups.data.filter(g => g.courses?.faculties?.slug === 'economics' && g.courses?.direction === 'applied-informatics');
          assert.equal(economicsAppliedInformaticsGroups.length, 0, 'Applied Informatics must not be attached to the economics faculty');

          const appliedInformaticsGroups = groups.data.filter(g => g.courses?.direction === 'applied-informatics');
          assert.equal(appliedInformaticsGroups.length, 4, 'Applied Informatics must have exactly four groups');
          assert.ok(appliedInformaticsGroups.every(g => g.courses?.faculties?.slug === 'customs'), 'Applied Informatics groups must belong to the Customs Affairs faculty');

          // Legacy URLs remain aliases for compatibility, but the canonical route is under customs.
          const legacyPi = await get('/api/economics/applied-informatics/course1-schedule');
          assert.ok(legacyPi._groups.includes('ПИ601/О-2601'), 'legacy Applied Informatics alias must still resolve to PI group');

          const allCustoms = await get('/api/customs/all-schedules');
          assert.ok(allCustoms._groups.includes('ПИ601/О-2601'), 'customs all-schedules must include Applied Informatics groups');
          for (const code of ['ПИ601/О-2601','ПИ601/О-2501','ПИ601/О-2401','ПИ601/О-2301']) {
            assert.ok(allCustoms.lessons.some(lesson => lesson.group === code), 'customs all-schedules missing lessons for ' + code);
          }

          const exports = new Map();
          for (const route of routes) {
            const body = await get(route.path);
            assert.ok(Array.isArray(body.lessons) && body.lessons.length > 0, route.label + ': lessons must be non-empty');
            assert.ok(['CONNECTED_TO_SUPABASE','VERIFIED','PRELIMINARY'].includes(body._status), route.label + ': unexpected status ' + body._status);
            assert.ok(Array.isArray(body._groups) && body._groups.length > 0, route.label + ': group list must be non-empty');
            for (const lesson of body.lessons) {
              assert.ok(body._groups.includes(lesson.group), route.label + ': lesson group missing from _groups: ' + lesson.group);
              assert.ok(Number.isInteger(Number(lesson.day)) && Number(lesson.day) >= 0 && Number(lesson.day) <= 6, route.label + ': invalid day');
              assert.ok(/^\d{2}:\d{2}$/.test(lesson.start || ''), route.label + ': invalid start time');
              assert.ok(/^\d{2}:\d{2}$/.test(lesson.end || ''), route.label + ': invalid end time');
              assert.ok(lesson.title, route.label + ': lesson title missing');

              // Applied Informatics was recently migrated; guard against incomplete rows.
              if (route.label.startsWith('applied informatics course ')) {
                assert.ok(lesson.teacher && lesson.teacher.trim() && lesson.teacher.trim() !== '-', route.label + ': teacher missing for ' + lesson.group + ' / ' + lesson.title);
                assert.ok(lesson.room && lesson.room.trim() && lesson.room.trim() !== '-', route.label + ': room missing for ' + lesson.group + ' / ' + lesson.title);
                assert.ok(lesson.type && lesson.type.trim() && lesson.type.trim().toLowerCase() !== 'занятие', route.label + ': explicit lesson type missing for ' + lesson.group + ' / ' + lesson.title);
              }
            }
            exports.set(route.label, body);
          }

          for (const direction of ['economics','applied informatics','management']) {
            for (const course of [1,2,3,4]) {
              const body = exports.get(direction+' course '+course);
              assert.ok(body.lessons.length > 0, direction+' course '+course+' export missing lessons');
              assert.ok(body._groups.every(code => body.lessons.some(lesson => lesson.group === code)), direction+' course '+course+' has a group without lessons');
            }
          }

          for (const route of customsRoutes) {
            const body = await get(route.path);
            assert.ok(Array.isArray(body._groups) && body._groups.length > 0, route.label + ': group list must be non-empty');
            assert.ok(body._groups.every(code => customsGroups.some(g => g.group_code === code)), route.label + ': group codes must belong to customs faculty');
            assert.ok(Array.isArray(body.lessons), route.label + ': lessons must be an array even while import is being completed');
            const groupsWithoutLessons = body._groups.filter(code => !body.lessons.some(lesson => lesson.group === code));
            console.log('CUSTOMS COVERAGE:', route.label, 'groups=' + body._groups.length, 'lessons=' + body.lessons.length, 'groupsWithoutLessons=' + groupsWithoutLessons.length);
            assert.equal(
              groupsWithoutLessons.length,
              0,
              route.label + ' has groups marked as available but without lessons: ' + groupsWithoutLessons.join(', ')
            );
            for (const lesson of body.lessons) {
              assert.ok(body._groups.includes(lesson.group), route.label + ': lesson group missing from _groups');
              assert.ok(Number.isInteger(Number(lesson.day)) && Number(lesson.day) >= 0 && Number(lesson.day) <= 6, route.label + ': invalid day');
              assert.ok(/^\d{2}:\d{2}$/.test(lesson.start || ''), route.label + ': invalid start time');
              assert.ok(/^\d{2}:\d{2}$/.test(lesson.end || ''), route.label + ': invalid end time');
              assert.ok(lesson.title, route.label + ': lesson title missing');
            }
          }

          const schedule = await get('/api/schedule?group_id=13&date=2026-10-22');
          assert.equal(schedule.date, '2026-10-22');
          assert.equal(schedule.week_type, 'A', '19–25 Oct 2026 is week A');
          const replacement = schedule.data.find(x => x.starts_at.startsWith('14:00') && x.ends_at.startsWith('15:30'));
          assert.ok(replacement, 'dated replacement at 14:00–15:30 must exist');
          assert.equal(replacement.subject, 'Международное уголовное право', 'dated replacement subject');
          assert.equal(replacement.teacher, 'С.В. Щербаков', 'dated replacement teacher');
          assert.ok(!schedule.data.some(x => x.starts_at.startsWith('14:00') && x.ends_at.startsWith('15:30') && x.subject === 'Семейное право'), 'recurring subject must be replaced');

          const weekB = await get('/api/schedule?group_id=13&date=2026-10-13');
          assert.equal(weekB.week_type, 'B', '12–18 Oct 2026 is week B');

          for (const path of [
            '/api/schedule?group_id=abc&date=2026-10-22',
            '/api/schedule?group_id=13&date=2026-02-30'
          ]) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(25000) });
            assert.equal(response.status, 400, path + ' must return HTTP 400');
          }

          console.log('PASS: API health/security headers, unauthenticated protected-route denial including reminder endpoints, faculties, all course exports, customs faculty/groups, lesson schemas, week A/B anchor and dated overrides');
          NODE
