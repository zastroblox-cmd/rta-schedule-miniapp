name: Live API smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test live API, all four courses, and dated overrides
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'https://rta-schedule-api.onrender.com';
          async function get(path, expected = 200) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(25000) });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(path + ': response is not JSON: ' + text.slice(0, 250)); }
            assert.equal(response.status, expected, path + ': ' + JSON.stringify(body));
            return body;
          }

          const health = await get('/health');
          assert.equal(health.status, 'ok', 'API health status');
          assert.equal(health.databaseConfigured, true, 'database configuration');

          const faculties = await get('/api/faculties');
          assert.ok(Array.isArray(faculties.data) && faculties.data.length > 0, 'faculties must be non-empty');

          const groups = await get('/api/groups');
          assert.ok(Array.isArray(groups.data) && groups.data.length === 17, 'expected 17 groups across all four courses');
          const courseCounts = new Map();
          for (const g of groups.data) {
            const course = Number(g.courses?.course_number);
            assert.ok(course >= 1 && course <= 4, 'group must map to a course: ' + JSON.stringify(g));
            courseCounts.set(course, (courseCounts.get(course) || 0) + 1);
          }
          assert.deepEqual([1,2,3,4].map(c => courseCounts.get(c) || 0), [4,4,4,5], 'expected group counts for courses 1–4');

          for (const course of [1, 2, 3, 4]) {
            const exported = await get('/api/course' + course + '-schedule');
            assert.ok(Array.isArray(exported.lessons) && exported.lessons.length > 0, 'course ' + course + ' lessons must be non-empty');
            assert.equal(exported._status, 'CONNECTED_TO_SUPABASE', 'course ' + course + ' must read from Supabase');
            assert.ok(Array.isArray(exported._groups), 'course ' + course + ' must return its group list');
            const expectedGroups = groups.data.filter(g => Number(g.courses?.course_number) === course).map(g => g.group_code);
            assert.deepEqual([...exported._groups].sort(), [...expectedGroups].sort(), 'course ' + course + ' group list');
            for (const groupCode of expectedGroups) {
              assert.ok(exported.lessons.some(x => x.group === groupCode), 'course ' + course + ' export missing group ' + groupCode);
            }
          }

          const group = groups.data.find(g => Number(g.id) === 13);
          assert.ok(group, 'expected group id=13 (Ю604/О-2404)');
          const schedule = await get('/api/schedule?group_id=13&date=2026-10-22');
          assert.equal(schedule.date, '2026-10-22');
          assert.equal(schedule.week_type, 'A', '19–25 Oct 2026 is week A');
          const replacement = schedule.data.find(x => x.starts_at.startsWith('14:00') && x.ends_at.startsWith('15:30'));
          assert.ok(replacement, 'dated replacement at 14:00–15:30 must exist');
          assert.equal(replacement.subject, 'Международное уголовное право', 'dated replacement subject');
          assert.equal(replacement.teacher, 'С.В. Щербаков', 'dated replacement teacher');
          assert.ok(!schedule.data.some(x => x.starts_at.startsWith('14:00') && x.ends_at.startsWith('15:30') && x.subject === 'Семейное право'), 'recurring subject must be replaced');

          const weekB = await get('/api/schedule?group_id=13&date=2026-10-13');
          assert.equal(weekB.week_type, 'B', '12–18 Oct 2026 is week B');

          for (const path of [
            '/api/schedule?group_id=abc&date=2026-10-22',
            '/api/schedule?group_id=13&date=2026-02-30'
          ]) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(25000) });
            assert.equal(response.status, 400, path + ' must return HTTP 400');
          }

          console.log('PASS: API health, faculties, all 17 groups, all four course exports, week A/B anchor, date override, invalid inputs');
          NODE
