name: Live API smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test live API, all faculty directions and dated overrides
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          const base = 'https://rta-schedule-api.onrender.com';
          async function get(path, expected = 200) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(25000) });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(path + ': response is not JSON: ' + text.slice(0, 250)); }
            assert.equal(response.status, expected, path + ': ' + JSON.stringify(body));
            return body;
          }

          const health = await get('/health');
          assert.equal(health.status, 'ok', 'API health status');
          assert.equal(health.databaseConfigured, true, 'database configuration');

          const faculties = await get('/api/faculties');
          assert.ok(Array.isArray(faculties.data) && faculties.data.length > 0, 'faculties must be non-empty');

          // /api/groups is shared across faculties and therefore must not be
          // pinned to the old law-only count. Validate the response shape only.
          const groups = await get('/api/groups');
          assert.ok(Array.isArray(groups.data) && groups.data.length > 0, 'groups must be non-empty');

          const routes = [
            ...[1,2,3,4].map(course => ({label:'law course '+course, path:'/api/course'+course+'-schedule'})),
            ...[1,2,3,4].map(course => ({label:'economics course '+course, path:'/api/economics/course'+course+'-schedule'})),
            ...[1,2,3,4].map(course => ({label:'applied informatics course '+course, path:'/api/economics/applied-informatics/course'+course+'-schedule'})),
            ...[1,2,3,4].map(course => ({label:'management course '+course, path:'/api/economics/management/course'+course+'-schedule'}))
          ];

          const exports = new Map();
          for (const route of routes) {
            const body = await get(route.path);
            assert.ok(Array.isArray(body.lessons) && body.lessons.length > 0, route.label + ': lessons must be non-empty');
            assert.ok(['CONNECTED_TO_SUPABASE','VERIFIED','PRELIMINARY'].includes(body._status), route.label + ': unexpected status ' + body._status);
            assert.ok(Array.isArray(body._groups) && body._groups.length > 0, route.label + ': group list must be non-empty');
            for (const lesson of body.lessons) {
              assert.ok(body._groups.includes(lesson.group), route.label + ': lesson group missing from _groups: ' + lesson.group);
              assert.ok(Number.isInteger(Number(lesson.day)) && Number(lesson.day) >= 0 && Number(lesson.day) <= 6, route.label + ': invalid day');
              assert.ok(/^\d{2}:\d{2}$/.test(lesson.start || ''), route.label + ': invalid start time');
              assert.ok(/^\d{2}:\d{2}$/.test(lesson.end || ''), route.label + ': invalid end time');
              assert.ok(lesson.title, route.label + ': lesson title missing');
            }
            exports.set(route.label, body);
          }

          for (const direction of ['economics','applied-informatics','management']) {
            for (const course of [1,2,3,4]) {
              const body = exports.get(direction+' course '+course);
              assert.ok(body.lessons.length > 0, direction+' course '+course+' export missing lessons');
              assert.ok(body._groups.every(code => body.lessons.some(lesson => lesson.group === code)), direction+' course '+course+' has a group without lessons');
            }
          }

          const schedule = await get('/api/schedule?group_id=13&date=2026-10-22');
          assert.equal(schedule.date, '2026-10-22');
          assert.equal(schedule.week_type, 'A', '19–25 Oct 2026 is week A');
          const replacement = schedule.data.find(x => x.starts_at.startsWith('14:00') && x.ends_at.startsWith('15:30'));
          assert.ok(replacement, 'dated replacement at 14:00–15:30 must exist');
          assert.equal(replacement.subject, 'Международное уголовное право', 'dated replacement subject');
          assert.equal(replacement.teacher, 'С.В. Щербаков', 'dated replacement teacher');
          assert.ok(!schedule.data.some(x => x.starts_at.startsWith('14:00') && x.ends_at.startsWith('15:30') && x.subject === 'Семейное право'), 'recurring subject must be replaced');

          const weekB = await get('/api/schedule?group_id=13&date=2026-10-13');
          assert.equal(weekB.week_type, 'B', '12–18 Oct 2026 is week B');

          for (const path of [
            '/api/schedule?group_id=abc&date=2026-10-22',
            '/api/schedule?group_id=13&date=2026-02-30'
          ]) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(25000) });
            assert.equal(response.status, 400, path + ' must return HTTP 400');
          }

          console.log('PASS: API health, faculties, all law/economics/applied-informatics/management course exports, lesson schemas, week A/B anchor and dated overrides');
          NODE
