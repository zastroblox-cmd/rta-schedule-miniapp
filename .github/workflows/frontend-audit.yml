name: Mini App frontend audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacy.html"
      - "data/*.js"
      - "data/*.json"
      - ".github/workflows/frontend-audit.yml"

permissions:
  contents: read

jobs:
  frontend-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check inline JavaScript syntax, DOM IDs, and required app hooks
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const privacy = fs.readFileSync('privacy.html', 'utf8');
          if (!html.includes('href="./privacy.html"')) throw new Error('Privacy page link missing from app');
          for (const text of ['Данные и конфиденциальность', 'Telegram ID', 'Режим старосты', 'пересылка обращений сейчас не настроена']) {
            if (!privacy.includes(text)) throw new Error('Privacy page is missing required disclosure: ' + text);
          }
          const inlineScripts = [...html.matchAll(/<script\b(?![^>]*\bsrc\s*=)[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1])
            .filter(script => script.trim());
          if (!inlineScripts.length) throw new Error('No inline application script found');
          fs.writeFileSync('/tmp/rta-miniapp-inline.js', inlineScripts.join('\n;\n'));

          const inlineStart = html.search(/<script\b(?![^>]*\bsrc\s*=)/i);
          const markup = inlineStart >= 0 ? html.slice(0, inlineStart) : html;
          const ids = [...markup.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          if (duplicates.length) throw new Error('Duplicate DOM IDs: ' + duplicates.join(', '));

          const idSet = new Set(ids);
          const refs = [...inlineScripts.join('\n').matchAll(/ownerQuery\(["']#([^"']+)["']\)/g)].map(match => match[1]);
          const missing = [...new Set(refs.filter(id => !idSet.has(id)))];
          if (missing.length) throw new Error('Owner panel references missing DOM IDs: ' + missing.join(', '));

          for (const id of ['days','weekRange','weekParity','lessonList','ownerTotalUsers','ownerActiveUsers30d','ownerActivityRate','ownerActivityBar','ownerRefreshStats']) {
            if (!idSet.has(id)) throw new Error('Required app element missing: #' + id);
          }
          for (const token of ['/api/course2-schedule','/api/analytics/track','/api/owner/analytics','2026, 9, 12']) {
            if (!html.includes(token)) throw new Error('Required app hook missing: ' + token);
          }

          // Applied Informatics belongs to Customs Affairs; guard both routing and browser cache invalidation.
          const customsAdapter = fs.readFileSync('data/customs-adapter.js', 'utf8');
          for (const group of ['ПИ601/О-2601','ПИ601/О-2501','ПИ601/О-2401','ПИ601/О-2301']) {
            if (!customsAdapter.includes(group)) throw new Error('Customs adapter missing Applied Informatics group: ' + group);
          }
          if (!html.includes('customs-adapter.js?v=20261102-customs-pi-v2')) {
            throw new Error('Customs adapter cache key was not bumped after routing changes');
          }
          if (!html.includes('/api/customs/applied-informatics/course"+course+"-schedule')) {
            throw new Error('Applied Informatics must use the canonical Customs API route');
          }
          if (html.includes('currentGroup.startsWith("ПИ")') || html.includes('currentGroup.startsWith("ПИ")')) {
            throw new Error('Applied Informatics routing must be based on selected faculty, not group-code prefix');
          }
          if (!html.includes('currentFaculty === "customs"') || !html.includes('currentFaculty === "economics"')) {
            throw new Error('Schedule loading must distinguish Customs Affairs and Economics by selected faculty');
          }
          console.log('PASS: DOM IDs, owner selectors, schedule/analytics hooks, Applied Informatics routing, cache key, and inline script extraction');
          NODE
      - name: Parse application JavaScript
        run: node --check /tmp/rta-miniapp-inline.js

      - name: Parse schedule JSON and adapter JavaScript
        run: |
          for file in data/*.js; do
            node --check "$file"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          for (const name of fs.readdirSync('data').filter(name => name.endsWith('.json'))) {
            const file = path.join('data', name);
            JSON.parse(fs.readFileSync(file, 'utf8'));
            console.log('PASS JSON:', file);
          }
          NODE
